    <section class="signup">
        <h2>Signup</h2>

        <form action="" class="signup-form">
            <input id="userName" type="text" placeholder="Your name">
            <input id="userEmail" type="email" placeholder="Your email">
            <input id="userPass" type="password" placeholder="Your password">
            <input id="userRePass" type="password" placeholder="Confirm password">
            <input id="userPhone" type="text" placeholder="Your phone">
            <button id="signupBtn">Sign up</button>
        </form>
    </section>

    <section class="signin">    
        <h2>SignIn</h2>

        <form action="" class="signin-form">
            <input id="userEmailSignIn" type="email" placeholder="Your email">
            <input id="userPassSignIn" type="password" placeholder="Your password">
            <button id="signinBtn">Sign in</button>
        </form>
    </section>

    <p id="message">
